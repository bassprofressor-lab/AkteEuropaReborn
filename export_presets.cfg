[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Data/ traegt unsere ABGELEITETEN Metadaten (der Kampagnen-Fahrplan aus der
; Zustandsmaschine der GAME.EXE) — keine Originalinhalte, und ohne diesen
; Eintrag nimmt der Export eine rohe .json nicht mit.
include_filter="Data/*.json"
; OpenRA model: the build ships only the engine. Nothing of the 1997
; game is redistributed — the content is derived on the player's
; machine into user://data at first start.
exclude_filter="*.md, *.py, *.import.bak, Assets/Legacy/*, docs/*, Screenshot*.png"
export_path="build/windows/AkteEuropaReborn.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

